[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papilio"
version = "1.0.0"
description = "A modular web API framework built on FastAPI and Dishka"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Pouya", email = "captainjoker757@gmail.com" }
]
keywords = [
    "fastapi",
    "framework",
    "modular-monolith",
    "dishka",
    "sqlmodel",
    "cqrs",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.136.0,<0.137.0",
    "dishka>=1.8.0,<2.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "PyYAML>=6.0.3,<7.0.0",
    "typer>=0.20.0,<0.21.0",
    "orjson>=3.11.5,<4.0.0",
    "rich>=14.2.0,<15.0.0",
    "swagger-ui-bundle>=1.1.0,<2.0.0",
    "email-validator>=2.3.0,<3.0.0",
    "python-multipart>=0.0.20,<0.1.0",
]

[project.optional-dependencies]
docs = ["mkdocs>=1.6,<2.0", "mkdocs-material>=9.6,<10.0"]
server = ["uvicorn[standard]>=0.38.0,<0.39.0"]
server-gunicorn = ["gunicorn>=26.2,<27"]
server-fastapi = ["papilio[server]", "fastapi-cli>=0.0.24,<0.1"]
db = ["SQLAlchemy>=2.0.49,<3.0.0", "sqlmodel>=0.0.38,<0.1.0", "alembic>=1.18.4,<2.0.0"]
postgresql = ["papilio[db]", "asyncpg>=0.31.0,<0.32.0", "psycopg2-binary>=2.9.11,<3.0.0"]
mssql = ["papilio[db]", "aioodbc>=0.5,<1.0"]
oracle = ["papilio[db]", "oracledb>=2,<5"]
mysql = ["papilio[db]", "asyncmy>=0.2.10,<0.3.0"]
mariadb = ["papilio[mysql]"]
sqlite = ["papilio[db]", "aiosqlite>=0.20,<1.0"]
es = ["elasticsearch[async]>=8.19.3,<9.0.0"]
redis = ["redis>=7.1.0,<8.0.0"]
rate-limit = ["throttled-py>=3.4.1,<4.0.0"]
rate-limit-redis = ["papilio[rate-limit,redis]"]
passwords = ["bcrypt>=5.0.0,<6.0.0"]
auth = ["PyJWT>=2.10.1,<3.0.0"]
crypto = ["cryptography>=46.0.3,<47.0.0"]
csrf = ["fastapi-csrf-protect>=1.0.7,<2.0.0"]
http = ["httpx>=0.28.1,<0.29.0"]
excel = ["openpyxl>=3.1.5,<4.0.0"]
files = ["anyio>=4.13.0,<5.0.0"]
csv = ["anyio>=4.13.0,<5.0.0"]
persian = ["jdatetime>=5.2.0,<6.0.0", "persiantools>=5.4.0,<6.0.0"]
test = ["pytest==9.0.1", "pytest-asyncio==1.3.0", "httpx>=0.28.1,<0.29.0"]
all = ["papilio[server,server-gunicorn,server-fastapi,postgresql,mssql,oracle,mysql,sqlite,es,redis,rate-limit-redis,passwords,auth,crypto,csrf,http,excel,files,csv,persian]"]
dev = ["papilio[all,test]", "ruff", "pyright==1.1.390"]

[project.scripts]
papilio = "papilio.cli.app:app"

# Only lightweight folder markers load automatically.
[project.entry-points.pytest11]
papilio = "papilio.testing.plugin"

[tool.hatch.build.targets.wheel]
packages = ["papilio"]

[tool.hatch.build.targets.sdist]
# Select project-root paths, including documentation and tests.
only-include = [
    "papilio",
    "tests",
    "docs",
    "README.md",
    "LICENSE",
    "pytest.ini",
    "mkdocs.yml",
    "pyproject.toml",
]

# pytest configuration lives in pytest.ini (single source of truth — pytest.ini
# takes precedence over pyproject, so do not re-add [tool.pytest.ini_options]).

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["papilio"]

[tool.pyright]
include = ["papilio"]
pythonVersion = "3.13"
# "basic" is pragmatic for an existing codebase; tighten to "strict" per
# package as it's hardened. The rules below are the type-safety floor.
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUntypedFunctionDecorator = "error"
reportUnnecessaryTypeIgnoreComment = "warning"
reportImplicitOverride = "none"
